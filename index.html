<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git 学习项目</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    main {
      width: min(100%, 560px);
      padding: 40px;
      text-align: center;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
    }

    h1 {
      margin-top: 0;
      color: #2563eb;
    }

    p {
      margin-bottom: 0;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <h1>Git 学习项目</h1>
    <p>这是一个用于练习 Git 和 GitHub 工作流程的模拟项目。</p>
  </main>
</body>
</html>
